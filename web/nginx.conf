server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  location /api/ { proxy_pass http://server:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /socket.io/ { proxy_pass http://server:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}
